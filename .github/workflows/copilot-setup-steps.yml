# Written by `discipline hook install --agent copilot --cloud-agent`.
# discipline-hook-file: sha256=ffb54c825fb8d9a6c5cf20651f48e65c79227a335c9d87a172f1341f94227602
# Copilot cloud agent runs this job before it starts working: it reads the
# repository's .github/hooks/ too, and a hook whose command is missing is skipped.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job must be called `copilot-setup-steps`, or Copilot does not run it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install discipline for Copilot's hooks
        uses: orieg/discipline@31b630aabdda8c2c71a92fc4eb956502786258ea # v0.24.0
        with:
          install_only: 'true'
