# Written by `discipline hook install --agent copilot --cloud-agent`.
# discipline-hook-file: sha256=9058a6bfb5b4172b3a425a7e2050a4e182dc93e282e03b37d21985a21ff7b4e7
# Copilot cloud agent runs this job before it starts working: it reads the
# repository's .github/hooks/ too, and a hook whose command is missing is skipped.
name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  # The job must be called `copilot-setup-steps`, or Copilot does not run it.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Install discipline for Copilot's hooks
        uses: orieg/discipline@794362b607c3e858ae9106b9762da5f3a796777a # v0.28.1
        with:
          install_only: 'true'
