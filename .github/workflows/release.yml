name: Release

# Pushing a tag `vX.Y.Z` builds the four release binaries, publishes a GitHub
# release with checksums and build provenance, then proves the published
# assets work by running the action against them. The major tag (`v0`, `v1`)
# only moves once that proof passes.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions: read-all

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches Cargo.toml and sits on main
        id: meta
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          manifest="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          [ "${version}" = "${manifest}" ] || {
            echo "::error::tag ${TAG} does not match Cargo.toml version ${manifest}"; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::${TAG} points at a commit that is not on main"; exit 1; }
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          case "${version}" in
            *-*) echo "prerelease=true" >> "${GITHUB_OUTPUT}" ;;
            *) echo "prerelease=false" >> "${GITHUB_OUTPUT}" ;;
          esac
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  build:
    needs: verify
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            static: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            static: true
          - target: aarch64-apple-darwin
            os: macos-latest
            static: false
          - target: x86_64-apple-darwin
            os: macos-latest
            static: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.static
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          STATIC: ${{ matrix.static }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/discipline"
          file "${bin}" | tee file.txt
          if [ "${STATIC}" = "true" ]; then
            grep -Eq 'statically linked|static-pie linked' file.txt || {
              echo "::error::${TARGET} binary is not statically linked"; exit 1; }
          fi
          # x86_64-apple-darwin is cross-built on Apple Silicon and runs under
          # Rosetta when present; every other target runs natively.
          if "${bin}" --version > version.txt 2>/dev/null; then
            grep -q "discipline ${VERSION}" version.txt || {
              echo "::error::binary reports '$(cat version.txt)', expected ${VERSION}"; exit 1; }
            "${bin}" self-test
          elif [ "${TARGET}" = "x86_64-apple-darwin" ]; then
            echo "::notice::x86_64-apple-darwin could not execute on this runner; self-test NOT run for this target"
          else
            echo "::error::${TARGET} binary does not execute on its own runner"; exit 1
          fi
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp "target/${TARGET}/release/discipline" LICENSE-MIT LICENSE-APACHE README.md "${stage}/"
          tar -czf "discipline-${TARGET}.tar.gz" -C "${stage}" .
          tar -tzf "discipline-${TARGET}.tar.gz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discipline-${{ matrix.target }}
          path: discipline-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 3
      - name: Package Linux OS packages (deb & rpm)
        if: matrix.static
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y rpm
          scripts/package_deb.sh "${VERSION}" "${TARGET%%-*}" "target/${TARGET}/release/discipline" packages
          scripts/package_rpm.sh "${VERSION}" "${TARGET%%-*}" "target/${TARGET}/release/discipline" packages
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.static
        with:
          name: discipline-packages-${{ matrix.target }}
          path: packages/*
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: discipline-*
          merge-multiple: true
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          count="$(find . -maxdepth 1 -name 'discipline-*.tar.gz' | wc -l | tr -d ' ')"
          # A build leg that silently produced nothing must not yield a release
          # that is missing a platform.
          [ "${count}" -eq 4 ] || { echo "::error::expected 4 archives, found ${count}"; exit 1; }
          sha256sum discipline-*.tar.gz discipline_*.deb discipline-*.rpm > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/discipline-*.tar.gz
            dist/discipline_*.deb
            dist/discipline-*.rpm
      - name: Generate Homebrew formula
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY || '' }}
        run: |
          set -euo pipefail
          python3 scripts/update_homebrew_formula.py \
            --version "${VERSION}" \
            --checksums dist/SHA256SUMS \
            --formula-file packaging/homebrew/discipline.rb \
            --output dist/discipline.rb
          if [ -n "${HOMEBREW_TAP_DEPLOY_KEY}" ]; then
            python3 scripts/update_homebrew_formula.py \
              --version "${VERSION}" \
              --checksums dist/SHA256SUMS \
              --push-to-tap orieg/homebrew-tap \
              --deploy-key "${HOMEBREW_TAP_DEPLOY_KEY}"
          else
            echo "::notice::HOMEBREW_TAP_DEPLOY_KEY not configured; skipping automatic push to orieg/homebrew-tap"
          fi
      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Generate notes via GitHub API and sanitize arbitrary @-mentions
          raw_notes="$(mktemp)"
          clean_notes="dist/release-notes-${TAG}.md"
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${TAG}" \
            --jq .body > "${raw_notes}"
          python3 tests/action/sanitize-release-notes.py "${raw_notes}" "${clean_notes}"

          flags=(--verify-tag --title "${TAG}" --notes-file "${clean_notes}")
          if [ "${PRERELEASE}" = "true" ]; then
            flags+=(--prerelease)
          fi
          # Draft first: the release only becomes visible (and `latest`) once
          # every asset is attached.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; updating notes and assets"
            gh release edit "${TAG}" --notes-file "${clean_notes}"
          else
            gh release create "${TAG}" --draft "${flags[@]}"
          fi
          gh release upload "${TAG}" dist/discipline-*.tar.gz dist/discipline_*.deb dist/discipline-*.rpm dist/discipline.rb dist/SHA256SUMS --clobber
          gh release edit "${TAG}" --draft=false
      - name: Prepare container image binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bin-amd64 bin-arm64
          tar -xzf dist/discipline-x86_64-unknown-linux-musl.tar.gz -C bin-amd64
          tar -xzf dist/discipline-aarch64-unknown-linux-musl.tar.gz -C bin-arm64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.10.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract container metadata
        id: meta_docker
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.prerelease == 'false' }}
      - name: Build and push multi-arch OCI container image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.15.0
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_docker.outputs.tags }}
          labels: ${{ steps.meta_docker.outputs.labels }}

  # Consume the release exactly as a user does: download, verify the checksum,
  # run. Uses the action at the tagged commit with no `binary_path`.
  smoke:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build fixtures
        run: |
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-clean" clean
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-bad" bad
      - name: Published binary accepts the clean change
        id: clean
        uses: ./
        with:
          version: ${{ github.ref_name }}
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: main
      - run: tests/action/assert-report.sh "${{ steps.clean.outputs.report }}" pass
      - name: Published binary rejects the bad change
        id: bad
        continue-on-error: true
        uses: ./
        with:
          version: ${{ github.ref_name }}
          working_directory: ${{ runner.temp }}/fx-bad
          base_ref: main
      - name: Rejection names the expected gates
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          REPORT: ${{ steps.bad.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::published binary passed the bad fixture"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail \
            assertion-reduction vacuous-tests unsafe-safety-comment time-estimates pii
      - name: Provenance attestation verifies
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir "${dir}" --pattern 'discipline-*.tar.gz'
          for f in "${dir}"/discipline-*.tar.gz; do
            gh attestation verify "${f}" --repo "${GITHUB_REPOSITORY}"
          done

  # `uses: orieg/discipline@v0` follows this tag. It moves last, and only for
  # stable releases, so the floating tag never points at an unproven release.
  move-major-tag:
    needs: [verify, smoke]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: move-major-tag
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the major tag
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          git fetch origin "refs/tags/${major}:refs/tags/${major}" || true
          if git rev-parse -q --verify "refs/tags/${major}" >/dev/null; then
            current_version="$(git show "refs/tags/${major}:Cargo.toml" 2>/dev/null | sed -n 's/^version = "\(.*\)"/\1/p' | head -n 1 || true)"
            if [ -n "${current_version}" ]; then
              older="$(printf '%s\n%s\n' "${VERSION}" "${current_version}" | sort -V | head -n 1)"
              if [ "${VERSION}" = "${current_version}" ] || [ "${older}" = "${VERSION}" ]; then
                echo "::notice::Refusing to move ${major} backwards: target has version ${current_version} >= ${VERSION}"
                exit 0
              fi
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --force "${major}" "${GITHUB_SHA}"
          git push --force origin "refs/tags/${major}"
          echo "moved ${major} to ${GITHUB_SHA}"
