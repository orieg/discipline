name: Pages

# Builds the documentation site from docs/ and assembles the APT and RPM
# repositories from the latest stable release's packages, signed with
# REPO_SIGNING_KEY. No package or repository metadata is committed: packages come
# from the release (checked against its SHA256SUMS), signatures are made here.
# The key is only read by `sign`, a job bound to the `package-signing`
# environment that runs no third-party action and can reach GitHub only.
# Repository > Settings > Pages must use "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_repo.py'
      - 'scripts/build_apt_repo.py'
      - 'scripts/build_rpm_repo.py'
      - 'scripts/site_theme.py'
      - '.github/workflows/pages.yml'
  # Releases dispatch this workflow from release.yml `promote`: a release made
  # with GITHUB_TOKEN does not trigger a `release` event here.
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Renders the site. It runs the Pages actions (one of them a container) and
  # holds no secret; its output is data for `sign`, never code.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      # The image actions/jekyll-build-pages v1.0.13 runs, by digest: the action's own
      # metadata names it by tag. Its inputs are passed as the action would pass them.
      - uses: docker://ghcr.io/actions/jekyll-build-pages@sha256:6791ebfd912185ed59bfb5fb102664fa872496b79f87ff8b9cfba292a7345041 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
          future: false
          build_revision: ${{ github.sha }}
          verbose: true
          token: ${{ github.token }}
      # The Jekyll container writes _site as root.
      - run: sudo chown -R "$(id -u):$(id -g)" _site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site
          path: _site
          if-no-files-found: error
          retention-days: 1

  # Adds the signed APT and RPM repositories to the rendered site. The only
  # job that reads REPO_SIGNING_KEY: first-party actions and this repository's
  # own scripts, from a checkout of the same commit, with egress limited to GitHub.
  sign:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: package-signing
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: _site
      - name: Latest stable release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh release view` without a tag is the latest stable release.
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir artifacts \
            --pattern '*.deb' --pattern '*.rpm' --pattern SHA256SUMS
          cd artifacts
          grep -E '\.(deb|rpm)$' SHA256SUMS | sha256sum --check --strict
          count="$(find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')"
          [ "${count}" -eq 4 ] || { echo "::error::expected 2 .deb and 2 .rpm in ${tag}, found ${count}"; exit 1; }
      - name: Import the repository signing key
        shell: bash
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_SIGNING_KEY}" ]; then
            echo "::error::REPO_SIGNING_KEY is not set. The APT and RPM repositories are only published signed."
            exit 1
          fi
          gnupg="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${gnupg}"
          # Loopback pinentry lets the passphrase come from the environment; the
          # agent must allow it as well as gpg asking for it.
          echo "allow-loopback-pinentry" > "${gnupg}/gpg-agent.conf"
          printf '%s\n' "${REPO_SIGNING_KEY}" | GNUPGHOME="${gnupg}" gpg --batch --import
          key="$(GNUPGHOME="${gnupg}" gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          [ -n "${key}" ] || { echo "::error::REPO_SIGNING_KEY holds no secret key"; exit 1; }
          echo "GNUPGHOME=${gnupg}" >> "${GITHUB_ENV}"
          echo "REPO_KEY=${key}" >> "${GITHUB_ENV}"
      - name: Build the signed repositories
        shell: bash
        env:
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          python3 scripts/build_repo.py --artifacts-dir artifacts --docs-dir _site \
            --version "${RELEASE_TAG#v}" --sign-key "${REPO_KEY}"
          gpgv --keyring _site/apt/discipline-archive-keyring.gpg _site/apt/dists/stable/InRelease
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
