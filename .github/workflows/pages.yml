name: Pages

# Builds the documentation site from docs/ and assembles the APT and RPM
# repositories from the latest stable release's packages, signed with
# REPO_SIGNING_KEY. No package or repository metadata is committed: packages come
# from the release (checked against its SHA256SUMS), signatures are made here.
# Repository > Settings > Pages must use "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_repo.py'
      - 'scripts/build_apt_repo.py'
      - 'scripts/build_rpm_repo.py'
      - 'scripts/site_theme.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published, released]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - name: Latest stable release packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh release view` without a tag is the latest stable release.
          tag="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "RELEASE_TAG=${tag}" >> "${GITHUB_ENV}"
          gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" --dir artifacts \
            --pattern '*.deb' --pattern '*.rpm' --pattern SHA256SUMS
          cd artifacts
          grep -E '\.(deb|rpm)$' SHA256SUMS | sha256sum --check --strict
          count="$(find . -maxdepth 1 \( -name '*.deb' -o -name '*.rpm' \) | wc -l | tr -d ' ')"
          [ "${count}" -eq 4 ] || { echo "::error::expected 2 .deb and 2 .rpm in ${tag}, found ${count}"; exit 1; }
      - name: Import the repository signing key
        shell: bash
        env:
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${REPO_SIGNING_KEY}" ]; then
            echo "::error::REPO_SIGNING_KEY is not set. The APT and RPM repositories are only published signed."
            exit 1
          fi
          gnupg="${RUNNER_TEMP}/gnupg"
          mkdir -m 700 "${gnupg}"
          # Loopback pinentry lets the passphrase come from the environment; the
          # agent must allow it as well as gpg asking for it.
          echo "allow-loopback-pinentry" > "${gnupg}/gpg-agent.conf"
          printf '%s\n' "${REPO_SIGNING_KEY}" | GNUPGHOME="${gnupg}" gpg --batch --import
          key="$(GNUPGHOME="${gnupg}" gpg --batch --list-secret-keys --with-colons | awk -F: '/^fpr/ { print $10; exit }')"
          [ -n "${key}" ] || { echo "::error::REPO_SIGNING_KEY holds no secret key"; exit 1; }
          echo "GNUPGHOME=${gnupg}" >> "${GITHUB_ENV}"
          echo "REPO_KEY=${key}" >> "${GITHUB_ENV}"
      - name: Build the signed repositories
        shell: bash
        env:
          REPO_SIGNING_PASSPHRASE: ${{ secrets.REPO_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          # The Jekyll container writes _site as root.
          sudo chown -R "$(id -u):$(id -g)" _site
          python3 scripts/build_repo.py --artifacts-dir artifacts --docs-dir _site \
            --version "${RELEASE_TAG#v}" --sign-key "${REPO_KEY}"
          gpgv --keyring _site/apt/discipline-archive-keyring.gpg _site/apt/dists/stable/InRelease
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
