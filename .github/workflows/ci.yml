name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `edited`: a changed PR description (a directive added or removed) re-runs the gates.
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: read-all

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Third-party actions are pinned by commit SHA. No job uses path filters, so
# `skipped` is never a legitimate result and `ci-gate` accepts only `success`.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install actionlint (pinned, checksum-verified)
        run: tests/action/install-tool.sh actionlint
      - run: actionlint -color .github/workflows/*.yml .gitea/workflows/*.yml .forgejo/workflows/*.yml
      - run: shellcheck tests/action/*.sh
      - name: Composite action shell blocks pass shellcheck
        run: python3 tests/action/lint-action.py action.yml
      - name: Check reference documentation and schemas are up to date
        run: cargo run -- docs --check
      - name: Validate relative documentation links and forbid obsolete references
        run: python3 tests/action/check-links.py
      - name: Check ecosystem theme contract
        run: python3 tests/action/check_ecosystem_theme.py --local-only
      - name: Test release notes sanitiser
        run: python3 tests/action/sanitize-release-notes.py --test
      - name: Release notes carry the compatibility ledger
        run: |
          python3 scripts/release_notes_upgrade.py --test
          python3 scripts/generate_portfile.py --test
          version="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          # The version being prepared must have ledger rows or none at all; this
          # renders them so a malformed table fails here, not during a release.
          python3 scripts/release_notes_upgrade.py --version "${version}" > /dev/null
      - name: Test major tag drift detector
        run: tests/action/test-check-major-tag.sh
      - name: Lint PR title for unquoted mentions
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          python3 tests/action/sanitize-release-notes.py --check-pr-title "${PR_TITLE}"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked 2>&1 | tee test.log
          # A filter, cfg, or harness change that selects zero tests exits 0.
          total="$(grep -Eo 'test result: ok\. [0-9]+ passed' test.log | awk '{ s += $4 } END { print s + 0 }')"
          echo "tests passed: ${total}"
          [ "${total}" -ge 65 ] || { echo "::error::only ${total} tests ran; the floor is 65"; exit 1; }
      - run: cargo run --locked --quiet -- self-test

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          v="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)"
          [ -n "${v}" ] || { echo "::error::Cargo.toml declares no rust-version"; exit 1; }
          echo "version=${v}" >> "${GITHUB_OUTPUT}"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo check --all-targets --locked

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  # The artifact every downstream job exercises: the same static binary shape
  # the release pipeline ships.
  build-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Binary is static and its detectors discriminate
        shell: bash
        run: |
          set -euo pipefail
          bin=target/x86_64-unknown-linux-musl/release/discipline
          file "${bin}" | tee file.txt
          grep -Eq 'statically linked|static-pie linked' file.txt
          "${bin}" self-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/discipline
          if-no-files-found: error
          retention-days: 3

  # The composite action on a real GitHub runner.
  action-github:
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: .ci-bin
      - run: chmod +x .ci-bin/discipline
      - name: Build fixtures
        run: |
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-clean" clean
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-bad" bad
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-del" deletion

      - name: "Positive control: clean change passes"
        id: clean
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: main
      - run: tests/action/assert-report.sh "${{ steps.clean.outputs.report }}" pass

      - name: "Negative control: bad change is rejected"
        id: bad
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-bad
          base_ref: main
      # Assert the *reason*, not only the failure: a missing binary fails too.
      - name: Rejection names the expected gates
        shell: bash
        env:
          OUTCOME: ${{ steps.bad.outcome }}
          STATUS: ${{ steps.bad.outputs.status }}
          REPORT: ${{ steps.bad.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::bad fixture did not fail the action"; exit 1; }
          [ "${STATUS}" = "fail" ] || { echo "::error::status output was '${STATUS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail \
            assertion-reduction vacuous-tests unsafe-safety-comment time-estimates pii

      - name: "Configurability: gates disabled through inputs stay silent"
        id: tuned
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-bad
          base_ref: main
          disable: |
            time-estimates
            pii
          config_override: |
            [gates.vacuous-tests]
            severity = "warning"
      - name: Only the still-enabled blocking gates fired
        shell: bash
        env:
          OUTCOME: ${{ steps.tuned.outcome }}
          WARNINGS: ${{ steps.tuned.outputs.warnings }}
          REPORT: ${{ steps.tuned.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ]
          [ "${WARNINGS}" = "1" ] || { echo "::error::expected 1 warning, got '${WARNINGS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail \
            assertion-reduction vacuous-tests unsafe-safety-comment

      - name: "Fail closed: an unresolvable base is an error, not a pass"
        id: nobase
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: no-such-branch
      - name: Unresolvable base failed the step
        shell: bash
        env:
          OUTCOME: ${{ steps.nobase.outcome }}
          STATUS: ${{ steps.nobase.outputs.status }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::unknown base passed"; exit 1; }
          [ "${STATUS}" = "error" ] || { echo "::error::expected status=error, got '${STATUS}'"; exit 1; }

      - name: "PR-body hygiene: time estimate in PR body fails"
        id: pr_time
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: main
          pr_title: "test: fixture (#1)"
          pr_body: "Plan: ship in 3 weeks."
          fail_on_warnings: true
      - name: PR body time estimate fails with time-estimates gate
        shell: bash
        env:
          OUTCOME: ${{ steps.pr_time.outcome }}
          STATUS: ${{ steps.pr_time.outputs.status }}
          REPORT: ${{ steps.pr_time.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::PR body with time estimate did not fail"; exit 1; }
          [ "${STATUS}" = "fail" ] || { echo "::error::status output was '${STATUS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail time-estimates

      - name: "PR-body override: bare-word directive fails to excuse directory deletion"
        id: pr_bare
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-del
          base_ref: main
          pr_title: "test: fixture (#1)"
          pr_body: "discipline:allow(deletion-rationale) tests"
      - name: Bare-word directive was rejected by deletion-rationale gate
        shell: bash
        env:
          OUTCOME: ${{ steps.pr_bare.outcome }}
          STATUS: ${{ steps.pr_bare.outputs.status }}
          REPORT: ${{ steps.pr_bare.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::bare-word directive incorrectly allowed deletion"; exit 1; }
          [ "${STATUS}" = "fail" ] || { echo "::error::status output was '${STATUS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail deletion-rationale

      - name: "PR-body override: hidden directive rejected by default"
        id: pr_hidden
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-del
          base_ref: main
          pr_title: "test: fixture (#1)"
          pr_body: "<!-- discipline:allow(deletion-rationale) tests/legacy/ -->"
      - name: Hidden directive was rejected by default
        shell: bash
        env:
          OUTCOME: ${{ steps.pr_hidden.outcome }}
          STATUS: ${{ steps.pr_hidden.outputs.status }}
          REPORT: ${{ steps.pr_hidden.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::hidden directive incorrectly allowed deletion"; exit 1; }
          [ "${STATUS}" = "fail" ] || { echo "::error::status output was '${STATUS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail deletion-rationale

      - name: "PR-body override: scoped directory prefix directive allows deletion"
        id: pr_scoped
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-del
          base_ref: main
          pr_title: "test: fixture (#1)"
          pr_body: "discipline:allow(deletion-rationale) tests/legacy/"
      - name: Scoped directory prefix directive passed
        shell: bash
        env:
          REPORT: ${{ steps.pr_scoped.outputs.report }}
          OVERRIDES: ${{ steps.pr_scoped.outputs.overrides }}
          OVERRIDDEN_GATES: ${{ steps.pr_scoped.outputs.overridden_gates }}
        run: |
          set -euo pipefail
          tests/action/assert-report.sh "${REPORT}" pass
          [ "${OVERRIDES}" = "1" ] || { echo "::error::expected overrides=1, got '${OVERRIDES}'"; exit 1; }
          [ "${OVERRIDDEN_GATES}" = "deletion-rationale" ] || { echo "::error::expected overridden_gates=deletion-rationale, got '${OVERRIDDEN_GATES}'"; exit 1; }

      - name: "Action config_override: reset sources to commits-only rejects pr_body directive"
        id: pr_sources_reset
        continue-on-error: true
        uses: ./
        with:
          binary_path: .ci-bin/discipline
          working_directory: ${{ runner.temp }}/fx-del
          base_ref: main
          pr_title: "test: fixture (#1)"
          config_override: |
            [directives]
            sources = ["__reset__", "commits"]
          pr_body: "discipline:allow(deletion-rationale) tests/legacy/"
      - name: Rejected pr_body directive when sources reset to commits-only
        shell: bash
        env:
          OUTCOME: ${{ steps.pr_sources_reset.outcome }}
          STATUS: ${{ steps.pr_sources_reset.outputs.status }}
          REPORT: ${{ steps.pr_sources_reset.outputs.report }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::pr_body was accepted despite sources being reset to commits-only"; exit 1; }
          [ "${STATUS}" = "fail" ] || { echo "::error::status output was '${STATUS}'"; exit 1; }
          tests/action/assert-report.sh "${REPORT}" fail deletion-rationale

      # The download path, before any real release exists: a local release
      # store laid out like GitHub's, served over HTTP.
      - name: Serve a fake release store
        shell: bash
        run: |
          set -euo pipefail
          tests/action/fake-release.sh .ci-bin/discipline "${RUNNER_TEMP}/store" v0.0.0-ci
          tests/action/fake-release.sh .ci-bin/discipline "${RUNNER_TEMP}/store" v0.0.0-tampered tamper
          (cd "${RUNNER_TEMP}/store" && nohup python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          for _ in 1 2 3 4 5; do
            curl --fail --silent --output /dev/null http://127.0.0.1:8765/download/v0.0.0-ci/SHA256SUMS && exit 0
            sleep 1
          done
          echo "::error::fake release store did not come up"; exit 1
      - name: "Download path: checksum-verified install works"
        id: download
        uses: ./
        with:
          version: v0.0.0-ci
          download_url: http://127.0.0.1:8765
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: main
      - run: tests/action/assert-report.sh "${{ steps.download.outputs.report }}" pass
      - name: "Download path: a tampered archive is refused"
        id: tampered
        continue-on-error: true
        uses: ./
        with:
          version: v0.0.0-tampered
          download_url: http://127.0.0.1:8765
          working_directory: ${{ runner.temp }}/fx-clean
          base_ref: main
      - name: Refusal was the checksum, and no verdict was produced
        shell: bash
        env:
          OUTCOME: ${{ steps.tampered.outcome }}
          INSTALL_ERROR: ${{ steps.tampered.outputs.install_error }}
          STATUS: ${{ steps.tampered.outputs.status }}
        run: |
          set -euo pipefail
          [ "${OUTCOME}" = "failure" ] || { echo "::error::tampered archive was installed"; exit 1; }
          case "${INSTALL_ERROR}" in
            *"checksum mismatch"*) ;;
            *) echo "::error::failed for another reason: '${INSTALL_ERROR}'"; exit 1 ;;
          esac
          [ -z "${STATUS}" ] || { echo "::error::a verdict was produced by an unverified binary"; exit 1; }
      - name: "Standalone installer: install.sh positive and negative controls"
        run: tests/action/test-install-script.sh .ci-bin/discipline "${RUNNER_TEMP}"
      - name: "Homebrew formula generator: positive and negative controls"
        run: tests/action/test-update-homebrew-formula.sh

  # Gitea's act_runner is built on nektos/act: run the Gitea workflow under act
  # with Gitea's runner image. A live Gitea server is the stronger check and is
  # tracked in docs/ROADMAP.md; this proves the action has no GitHub-only dependency.
  action-gitea:
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: .ci-bin
      - run: chmod +x .ci-bin/discipline
      - name: Install act (pinned, checksum-verified)
        run: tests/action/install-tool.sh act
      - name: Run .gitea/workflows/action-selftest.yml under act
        shell: bash
        run: |
          set -euo pipefail
          act push \
            --workflows .gitea/workflows/action-selftest.yml \
            --platform ubuntu-latest=gitea/runner-images:ubuntu-latest \
            --bind 2>&1 | tee act.log
          # act exits 0 when it matched no job; require proof the jobs ran.
          grep -q 'report matches expectation: pass' act.log
          grep -q 'report matches expectation: fail' act.log
      # The job-container recipe documented in docs/CONFIGURATION.md, extracted
      # verbatim and run under act against the image built from this binary:
      # the job must schedule, land on the pull request head, pass a clean
      # change and reject a bad one by name.
      - name: Build the container image from this run's binary
        run: |
          mkdir -p bin-amd64 && cp .ci-bin/discipline bin-amd64/discipline
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t discipline:test .
      - name: Run the documented container recipe under act
        run: tests/action/test-container-recipe.sh discipline:test

  # The local pre-commit path, through the pre-commit framework.
  pre-commit:
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: .ci-bin
      - name: Put the binary on PATH and install pre-commit
        run: |
          chmod +x .ci-bin/discipline
          echo "${GITHUB_WORKSPACE}/.ci-bin" >> "${GITHUB_PATH}"
          pipx install pre-commit
      - run: tests/action/test-pre-commit.sh "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"

  # discipline gates its own repository.
  dogfood:
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: .ci-bin
      - run: chmod +x .ci-bin/discipline
      - uses: ./
        id: discipline
        with:
          binary_path: .ci-bin/discipline
          # A pull request is judged by main's discipline.toml, not by its own copy.
          policy_from: base
      # Checks that need no forge API: a discipline job that cannot fail, a trigger that
      # misses description edits, a gate file CODEOWNERS does not cover. Warnings fail.
      - name: discipline doctor (local checks)
        run: .ci-bin/discipline doctor --local-only --strict
      # Forge-side checks with the workflow's read token: the required check, up-to-date
      # policy, force-push and deletion blocking, review rules, bypass actors, merge
      # methods. Warnings are visible in the log; `--strict` is switched on once the
      # branch rules block deletion and require pull requests (both are repository
      # settings, tracked in docs/ROADMAP.md).
      - name: discipline doctor (forge checks)
        env:
          GH_TOKEN: ${{ github.token }}
        run: .ci-bin/discipline doctor
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: discipline-report-dogfood
          path: ${{ steps.discipline.outputs.report }}
          if-no-files-found: ignore

  # Smoke test the built container image with non-root USER 10001 against a root-owned checkout (reproducing R1).
  docker-smoke:
    needs: build-static
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: bin-amd64
      - run: chmod +x bin-amd64/discipline
      - name: Build local container image
        run: |
          docker build -f Dockerfile.release --build-arg TARGETARCH=amd64 -t discipline:test .
      - name: Create root-owned fixture repo (reproducing container UID mismatch)
        run: |
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-root" clean
          sudo chown -R 0:0 "${RUNNER_TEMP}/fx-root"
      - name: "Smoke test container against root-owned workspace (positive control)"
        run: |
          docker run --rm -v "${RUNNER_TEMP}/fx-root":/workspace discipline:test check --base main --format json > "${RUNNER_TEMP}/fx-root-clean.json"
          tests/action/assert-report.sh "${RUNNER_TEMP}/fx-root-clean.json" pass
      - name: "Negative control: bad fixture is detected and rejected with real gate verdicts"
        run: |
          tests/action/make-fixture.sh "${RUNNER_TEMP}/fx-root-bad" bad
          sudo chown -R 0:0 "${RUNNER_TEMP}/fx-root-bad"
          if docker run --rm -v "${RUNNER_TEMP}/fx-root-bad":/workspace discipline:test check --base main --format json > "${RUNNER_TEMP}/fx-root-bad.json"; then
            echo "Expected bad fixture to fail check" >&2
            exit 1
          fi
          tests/action/assert-report.sh "${RUNNER_TEMP}/fx-root-bad.json" fail assertion-reduction pii time-estimates unsafe-safety-comment vacuous-tests
      - name: "Smoke test container in-container checkout (GitLab/Woodpecker pipeline reproduction)"
        run: |
          docker run --rm discipline:test sh -c '
            set -euo pipefail
            git init -b main
            git config user.email "ci@example.invalid"
            git config user.name "ci"
            echo "# Agents Guide" > AGENTS.md
            cat > tests.rs << "EOF"
          #[test]
          fn works() {
              let x = 1;
              assert_eq!(x + 1, 2);
          }
          EOF
            git add -A
            git commit -m "chore: base"
            git checkout -b work
            cat >> tests.rs << "EOF"

          #[test]
          fn extra() {
              let x = 2;
              assert_eq!(x + 2, 4);
          }
          EOF
            git add -A
            git commit -m "test: add extra test"
            discipline check --base main
          '

  ci-gate:
    if: always()
    needs: [lint, test, msrv, supply-chain, build-static, action-github, action-gitea, pre-commit, dogfood, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          echo "${NEEDS}" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Allow-list, not deny-list: anything other than `success` — including
          # `skipped`, `cancelled`, or a result string added later — fails.
          bad="$(echo "${NEEDS}" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')"
          count="$(echo "${NEEDS}" | jq 'length')"
          [ "${count}" -eq 10 ] || { echo "::error::expected 10 needed jobs, saw ${count}"; exit 1; }
          [ -z "${bad}" ] || { echo "::error::not successful: ${bad}"; exit 1; }
      # Dogfood ci-skip-set on this rollup's own runtime context. Every job
      # above is unconditional, so each must have run; the inverted canary
      # proves the gate evaluated the context rather than noting it absent.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: discipline-x86_64-unknown-linux-musl
          path: .ci-bin
      - name: Skip set matches each job's if (ci-skip-set)
        shell: bash
        env:
          DISCIPLINE_CI_CONTEXT: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          chmod +x .ci-bin/discipline
          report="${RUNNER_TEMP}/skip-set.json"
          .ci-bin/discipline check --suite integrity --base HEAD --format github-summary --json-out "${report}"
          count="$(echo "${DISCIPLINE_CI_CONTEXT}" | jq 'length')"
          jq -e --argjson n "${count}" '.outcomes[] | select(.gate == "ci-skip-set") | .examined == $n and (.violations | length) == 0' "${report}" \
            || { echo "::error::ci-skip-set did not evaluate all ${count} rollup dependencies"; exit 1; }
      - name: "Inverted canary: a skipped unconditional job is reported by ci-skip-set"
        shell: bash
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          first="$(echo "${NEEDS}" | jq -r 'keys[0]')"
          DISCIPLINE_CI_CONTEXT="$(echo "${NEEDS}" | jq -c --arg j "${first}" '.[$j].result = "skipped"')"
          export DISCIPLINE_CI_CONTEXT
          report="${RUNNER_TEMP}/skip-set-canary.json"
          rc=0
          .ci-bin/discipline check --suite integrity --base HEAD --format json --json-out "${report}" > /dev/null || rc=$?
          [ "${rc}" -eq 1 ] || { echo "::error::expected exit 1 from the canary, got ${rc}"; exit 1; }
          jq -e --arg t "\`${first}\` skipped although its \`if:\` is true" \
            '[.outcomes[] | select(.gate == "ci-skip-set") | .violations[].title] | any(. == $t)' "${report}" \
            || { echo "::error::canary did not carry the ci-skip-set diagnostic"; jq '.outcomes[] | select(.gate == "ci-skip-set")' "${report}"; exit 1; }
