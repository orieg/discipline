# discipline.toml — dogfood configuration for orieg/discipline.
#
# Every available gate is on at severity "error" by default, so this file only
# needs to state what differs. `discipline gates` prints the effective state;
# the annotated reference lives in README.md ("Configuration").

[meta]
version = 1
name = "discipline"
description = "Universal CI/CD gatekeeper and AI coding agent diff sentinel"

[gates.assertion-reduction]
exempt_paths = ["tests/fixtures/**"]

[gates.vacuous-tests]
exempt_paths = ["tests/fixtures/**"]

[gates.ignored-tests]
exempt_paths = ["tests/fixtures/**"]
