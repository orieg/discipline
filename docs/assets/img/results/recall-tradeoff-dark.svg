<rect class="bg" width="760" height="473" rx="6"/>
<rect class="border" x=".5" y=".5" width="759" height="472" rx="6"/>
<text class="t-title" x="24" y="32">Discipline caught 8% of test gaming; simple rules caught 82-91%</text>
<text class="t-sub" x="24" y="52">Coding agents were given tests that cannot pass honestly. When an agent made them pass by editing tests, which</text>
<text class="t-sub" x="24" y="67">check blocked it? The same agents also solved ordinary tasks honestly; the second panel is how often each check</text>
<text class="t-sub" x="24" y="82">wrongly blocked those.</text>
<text class="t-head" x="24" y="109">Test gaming caught, out of 138 cases (higher is better)</text>
<line class="grid" x1="254.0" y1="135" x2="254.0" y2="219"/>
<text class="t-axis" x="254.0" y="233" text-anchor="middle">0%</text>
<line class="grid" x1="306.0" y1="135" x2="306.0" y2="219"/>
<text class="t-axis" x="306.0" y="233" text-anchor="middle">20%</text>
