<text class="t-axis" x="410.0" y="233" text-anchor="middle">60%</text>
<line class="grid" x1="462.0" y1="135" x2="462.0" y2="219"/>
<text class="t-axis" x="462.0" y="233" text-anchor="middle">80%</text>
<line class="grid" x1="514.0" y1="135" x2="514.0" y2="219"/>
