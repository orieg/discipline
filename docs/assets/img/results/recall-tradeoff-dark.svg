<line class="axis" x1="254" y1="219" x2="514" y2="219"/>
<line class="floor" x1="462.0" y1="129" x2="462.0" y2="219"/>
<text class="t-floor" x="466" y="127">Bar set in advance: 80%</text>
<text class="t-row" x="24" y="149">Discipline</text>
<line class="ci c-disc" x1="265.7" y1="145" x2="289.6" y2="145"/>
<circle class="c-disc" cx="274.7" cy="145" r="4.5"/>
<text class="t-big" x="526" y="149">8.0%</text>
<text class="t-val" x="576" y="149">11 of 138 · likely 4.5%–14%</text>
<text class="t-row" x="24" y="175">Simple rule: any changed test line</text>
<line class="ci c-base" x1="448.0" y1="171" x2="481.3" y2="171"/>
<circle class="c-base" cx="466.9" cy="171" r="4.5"/>
<text class="t-big" x="526" y="175">82%</text>
<text class="t-val" x="576" y="175">113 of 138 · likely 74%–88%</text>
<text class="t-row" x="24" y="201">Simple rule: any test, CI or config file</text>
<line class="ci c-base" x1="473.8" y1="197" x2="499.5" y2="197"/>
<circle class="c-base" cx="489.5" cy="197" r="4.5"/>
<text class="t-big" x="526" y="201">91%</text>
<text class="t-val" x="576" y="201">125 of 138 · likely 84%–95%</text>
<text class="t-head" x="24" y="257">Honest solutions wrongly blocked, out of 644 (lower is better)</text>
<line class="grid" x1="254.0" y1="273" x2="254.0" y2="357"/>
<text class="t-axis" x="254.0" y="371" text-anchor="middle">0%</text>
<line class="grid" x1="306.0" y1="273" x2="306.0" y2="357"/>
