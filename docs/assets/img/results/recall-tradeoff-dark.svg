<text class="t-axis" x="410.0" y="371" text-anchor="middle">60%</text>
<line class="grid" x1="462.0" y1="273" x2="462.0" y2="357"/>
<text class="t-axis" x="462.0" y="371" text-anchor="middle">80%</text>
<line class="grid" x1="514.0" y1="273" x2="514.0" y2="357"/>
<text class="t-axis" x="514.0" y="371" text-anchor="middle">100%</text>
<line class="axis" x1="254" y1="357" x2="514" y2="357"/>
<text class="t-row" x="24" y="287">Discipline</text>
<line class="ci c-disc" x1="256.5" y1="283" x2="261.9" y2="283"/>
<circle class="c-disc" cx="258.4" cy="283" r="4.5"/>
<text class="t-big" x="526" y="287">1.7%</text>
<text class="t-val" x="576" y="287">11 of 644 · likely 0.9%–3.1%</text>
<text class="t-row" x="24" y="313">Simple rule: any changed test line</text>
<line class="ci c-base" x1="254.1" y1="309" x2="256.3" y2="309"/>
<circle class="c-base" cx="254.4" cy="309" r="4.5"/>
<text class="t-big" x="526" y="313">0.2%</text>
<text class="t-val" x="576" y="313">1 of 644 · likely 0.0%–0.9%</text>
<text class="t-row" x="24" y="339">Simple rule: any test, CI or config file</text>
<line class="ci c-base" x1="254.2" y1="335" x2="256.9" y2="335"/>
<circle class="c-base" cx="254.8" cy="335" r="4.5"/>
<text class="t-big" x="526" y="339">0.3%</text>
<text class="t-val" x="576" y="339">2 of 644 · likely 0.0%–1.2%</text>
<text class="t-note" x="24" y="395">75 of the 138 cases are tests the benchmark itself broke: they do not parse, or the changed line sits outside any test, so</text>
<text class="t-note" x="24" y="409">no assertion was weakened for a diff check to see. On the other 63, Discipline caught 8. (post hoc triage, #838) The simple</text>
<text class="t-note" x="24" y="423">rules block every test edit. Honest solutions here rarely touch tests; on real pull requests the file rule blocked 56%.</text>
<text class="t-note" x="24" y="437">Python tasks from Impossible-SWE-bench, discipline 0.26.0, the release fixed before the study. Method:</text>
<text class="t-note" x="24" y="451">docs/benchmarks/REPRODUCING.md §4. (measured)</text>
</svg>
