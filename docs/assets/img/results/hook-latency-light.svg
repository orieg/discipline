<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 406" width="100%">
<title>Each agent edit is checked in 4.3 to 7.9 seconds; a full CI check takes 6.3 to 19.5</title>
<defs><style>
.bg{fill:#fff} .border{stroke:#e2e8f0;fill:none} .grid{stroke:#f1f5f9;stroke-dasharray:2,3}
.axis{stroke:#cbd5e1;stroke-width:1.5px} .floor{stroke:#b45309;stroke-width:1.5px;stroke-dasharray:5,3}
.t-title{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:14px;font-weight:700;fill:#0f172a}
.t-sub{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:11px;font-weight:500;fill:#334155}
.t-note{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:10px;fill:#64748b}
.t-head{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:11px;font-weight:700;fill:#0f172a}
.t-row{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:11px;font-weight:600;fill:#0f172a}
.t-axis{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:9.5px;fill:#64748b}
.t-val{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:10.5px;font-weight:600;fill:#334155}
.t-big{font-family:ui-monospace, SFMono-Regular, Menlo, monospace;font-size:11px;font-weight:700;fill:#0f172a}
.t-floor{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;font-size:10px;font-weight:700;fill:#b45309}
.c-disc{fill:#4f46e5;stroke:#4f46e5} .c-base{fill:#64748b;stroke:#64748b}
.c-hollow{fill:#fff;stroke:#4f46e5;stroke-width:2px}
.ci{stroke-width:2.5px;stroke-linecap:round}
</style></defs>
<rect class="bg" width="760" height="406" rx="6"/>
<rect class="border" x=".5" y=".5" width="759" height="405" rx="6"/>
<text class="t-title" x="24" y="32">Each agent edit is checked in 4.3 to 7.9 seconds; a full CI check takes 6.3 to 19.5</text>
<text class="t-sub" x="24" y="52">Typical (median) time for a one-file change, over 7 runs. Lower is better. Runs varied by under 0.06 s. In</text>
<text class="t-sub" x="24" y="67">blocking mode the agent waits for the check; in observe mode the check runs in the background and never blocks.</text>
<text class="t-head" x="24" y="94">On this repository (1405 files)</text>
<line class="grid" x1="254.0" y1="110" x2="254.0" y2="194"/>
<text class="t-axis" x="254.0" y="208" text-anchor="middle">0 s</text>
<line class="grid" x1="306.0" y1="110" x2="306.0" y2="194"/>
<text class="t-axis" x="306.0" y="208" text-anchor="middle">4 s</text>
<line class="grid" x1="358.0" y1="110" x2="358.0" y2="194"/>
<text class="t-axis" x="358.0" y="208" text-anchor="middle">8 s</text>
<line class="grid" x1="410.0" y1="110" x2="410.0" y2="194"/>
<text class="t-axis" x="410.0" y="208" text-anchor="middle">12 s</text>
<line class="grid" x1="462.0" y1="110" x2="462.0" y2="194"/>
<text class="t-axis" x="462.0" y="208" text-anchor="middle">16 s</text>
<line class="grid" x1="514.0" y1="110" x2="514.0" y2="194"/>
<text class="t-axis" x="514.0" y="208" text-anchor="middle">20 s</text>
<line class="axis" x1="254" y1="194" x2="514" y2="194"/>
<text class="t-row" x="24" y="124">CI check (every gate)</text>
<line class="ci c-base" x1="507.1" y1="120" x2="507.8" y2="120"/>
<circle class="c-base" cx="507.4" cy="120" r="4.5"/>
<text class="t-big" x="526" y="124">19.5 s</text>
<text class="t-val" x="576" y="124"></text>
<text class="t-row" x="24" y="150">Agent edit hook, blocking mode</text>
<line class="ci c-disc" x1="356.5" y1="146" x2="357.0" y2="146"/>
<circle class="c-disc" cx="356.8" cy="146" r="4.5"/>
<text class="t-big" x="526" y="150">7.9 s</text>
<text class="t-val" x="576" y="150"></text>
<text class="t-row" x="24" y="176">Agent edit hook, observe mode</text>
<line class="ci c-disc" x1="254.2" y1="172" x2="254.3" y2="172"/>
<circle class="c-hollow" cx="254.2" cy="172" r="4.5"/>
<text class="t-big" x="526" y="176">0.02 s</text>
<text class="t-val" x="576" y="176"></text>
<text class="t-head" x="24" y="232">On ripgrep, a mid-size Rust project (225 files)</text>
<line class="grid" x1="254.0" y1="248" x2="254.0" y2="332"/>
<text class="t-axis" x="254.0" y="346" text-anchor="middle">0 s</text>
<line class="grid" x1="306.0" y1="248" x2="306.0" y2="332"/>
<text class="t-axis" x="306.0" y="346" text-anchor="middle">4 s</text>
<line class="grid" x1="358.0" y1="248" x2="358.0" y2="332"/>
<text class="t-axis" x="358.0" y="346" text-anchor="middle">8 s</text>
<line class="grid" x1="410.0" y1="248" x2="410.0" y2="332"/>
<text class="t-axis" x="410.0" y="346" text-anchor="middle">12 s</text>
<line class="grid" x1="462.0" y1="248" x2="462.0" y2="332"/>
<text class="t-axis" x="462.0" y="346" text-anchor="middle">16 s</text>
<line class="grid" x1="514.0" y1="248" x2="514.0" y2="332"/>
<text class="t-axis" x="514.0" y="346" text-anchor="middle">20 s</text>
<line class="axis" x1="254" y1="332" x2="514" y2="332"/>
<text class="t-row" x="24" y="262">CI check (every gate)</text>
<line class="ci c-base" x1="335.5" y1="258" x2="335.8" y2="258"/>
<circle class="c-base" cx="335.6" cy="258" r="4.5"/>
<text class="t-big" x="526" y="262">6.3 s</text>
<text class="t-val" x="576" y="262"></text>
<text class="t-row" x="24" y="288">Agent edit hook, blocking mode</text>
<line class="ci c-disc" x1="309.7" y1="284" x2="309.8" y2="284"/>
<circle class="c-disc" cx="309.7" cy="284" r="4.5"/>
<text class="t-big" x="526" y="288">4.3 s</text>
<text class="t-val" x="576" y="288"></text>
<text class="t-row" x="24" y="314">Agent edit hook, observe mode</text>
<line class="ci c-disc" x1="254.1" y1="310" x2="254.1" y2="310"/>
<circle class="c-hollow" cx="254.1" cy="310" r="4.5"/>
<text class="t-big" x="526" y="314">0.01 s</text>
<text class="t-val" x="576" y="314"></text>
<text class="t-note" x="24" y="370">The CI check runs every gate; the edit hook runs the gates an edit can trip, and the full set runs when the agent stops.</text>
<text class="t-note" x="24" y="384">Release build of the 0.32.0 code, network off. Method: docs/benchmarks/hook-latency.md §4.4. (measured: AWS c7g.2xlarge)</text>
</svg>
