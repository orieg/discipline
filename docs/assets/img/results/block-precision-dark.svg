</style></defs>
<rect class="bg" width="760" height="477" rx="6"/>
<rect class="border" x=".5" y=".5" width="759" height="476" rx="6"/>
<text class="t-title" x="24" y="32">When discipline blocks, the flagged code has the problem its rule names 84% of the time;</text>
<text class="t-title" x="24" y="51">for the simple rule's flags, 2.0%</text>
<text class="t-sub" x="24" y="71">Each finding behind a block was graded: does the flagged code really have the defect the rule describes? Dot:</text>
<text class="t-sub" x="24" y="86">measured share. Line: the likely range.</text>
<line class="grid" x1="254.0" y1="113" x2="254.0" y2="197"/>
<text class="t-axis" x="254.0" y="211" text-anchor="middle">0%</text>
<line class="grid" x1="306.0" y1="113" x2="306.0" y2="197"/>
<text class="t-axis" x="306.0" y="211" text-anchor="middle">20%</text>
<line class="grid" x1="358.0" y1="113" x2="358.0" y2="197"/>
<text class="t-axis" x="358.0" y="211" text-anchor="middle">40%</text>
<line class="grid" x1="410.0" y1="113" x2="410.0" y2="197"/>
<text class="t-axis" x="410.0" y="211" text-anchor="middle">60%</text>
<line class="grid" x1="462.0" y1="113" x2="462.0" y2="197"/>
<text class="t-axis" x="462.0" y="211" text-anchor="middle">80%</text>
<line class="grid" x1="514.0" y1="113" x2="514.0" y2="197"/>
<text class="t-axis" x="514.0" y="211" text-anchor="middle">100%</text>
<line class="axis" x1="254" y1="197" x2="514" y2="197"/>
<text class="t-row" x="24" y="127">Discipline</text>
<line class="ci c-disc" x1="454.1" y1="123" x2="487.5" y2="123"/>
<circle class="c-disc" cx="473.5" cy="123" r="4.5"/>
<text class="t-big" x="526" y="127">84%</text>
<text class="t-val" x="576" y="127">103 of 122 · likely 76%–90%</text>
<text class="t-row" x="24" y="153">Discipline, whole pull requests resampled</text>
<line class="ci c-disc" x1="408.5" y1="149" x2="500.0" y2="149"/>
<circle class="c-hollow" cx="473.5" cy="149" r="4.5"/>
<text class="t-big" x="526" y="153">84%</text>
<text class="t-val" x="576" y="153">103 of 122 · likely 59%–95%</text>
<text class="t-row" x="24" y="179">Simple rule: any test, CI or config file</text>
<line class="ci c-base" x1="255.8" y1="175" x2="268.9" y2="175"/>
<circle class="c-base" cx="259.2" cy="175" r="4.5"/>
<text class="t-big" x="526" y="179">2.0%</text>
<text class="t-val" x="576" y="179">3 of 150 · likely 0.6%–5.8%</text>
<text class="t-head" x="24" y="235">By check (the four with 10 or more findings)</text>
<line class="grid" x1="254.0" y1="251" x2="254.0" y2="361"/>
<text class="t-axis" x="254.0" y="375" text-anchor="middle">0%</text>
<line class="grid" x1="306.0" y1="251" x2="306.0" y2="361"/>
<text class="t-axis" x="306.0" y="375" text-anchor="middle">20%</text>
<line class="grid" x1="358.0" y1="251" x2="358.0" y2="361"/>
<text class="t-axis" x="358.0" y="375" text-anchor="middle">40%</text>
<line class="grid" x1="410.0" y1="251" x2="410.0" y2="361"/>
<text class="t-axis" x="410.0" y="375" text-anchor="middle">60%</text>
<line class="grid" x1="462.0" y1="251" x2="462.0" y2="361"/>
<text class="t-axis" x="462.0" y="375" text-anchor="middle">80%</text>
<line class="grid" x1="514.0" y1="251" x2="514.0" y2="361"/>
<text class="t-axis" x="514.0" y="375" text-anchor="middle">100%</text>
<line class="axis" x1="254" y1="361" x2="514" y2="361"/>
<text class="t-row" x="24" y="265">CI workflow changes</text>
<line class="ci c-disc" x1="499.7" y1="261" x2="514.0" y2="261"/>
<circle class="c-disc" cx="514.0" cy="261" r="4.5"/>
<text class="t-big" x="526" y="265">100%</text>
<text class="t-val" x="576" y="265">66 of 66 · likely 94%–100%</text>
<text class="t-row" x="24" y="291">Swallowed errors</text>
<line class="ci c-disc" x1="415.9" y1="287" x2="509.8" y2="287"/>
<circle class="c-disc" cx="490.4" cy="287" r="4.5"/>
<text class="t-big" x="526" y="291">91%</text>
<text class="t-val" x="576" y="291">10 of 11 · likely 62%–99%</text>
<text class="t-row" x="24" y="317">Changed expected outputs</text>
<line class="ci c-disc" x1="404.2" y1="313" x2="502.8" y2="313"/>
<circle class="c-disc" cx="474.0" cy="313" r="4.5"/>
<text class="t-big" x="526" y="317">85%</text>
<text class="t-val" x="576" y="317">11 of 13 · likely 57%–96%</text>
<text class="t-row" x="24" y="343">New dependencies</text>
<line class="ci c-disc" x1="321.1" y1="339" x2="425.1" y2="339"/>
<circle class="c-disc" cx="371.0" cy="339" r="4.5"/>
<text class="t-big" x="526" y="343">45%</text>
<text class="t-val" x="576" y="343">9 of 20 · likely 25%–66%</text>
<text class="t-note" x="24" y="399">Graded by two AI models from different vendors, not by people; they agreed on 266 of 276 findings, and a third AI model,</text>
<text class="t-note" x="24" y="413">from one of those vendors, settled the other 10 without seeing their answers. 19 of 122 were not the defect, or could not be</text>
<text class="t-note" x="24" y="427">told from the change. One pull request holds 52 of the findings, all CI workflow changes; the second line counts each pull</text>
<text class="t-note" x="24" y="441">request as one draw, so its range is wider. Whether maintainers wanted these blocks cannot be measured here: every pull</text>
<text class="t-note" x="24" y="455">request in the set was merged. Discipline 0.32.0. (measured)</text>
</svg>
