<circle class="c-disc" cx="474.0" cy="294" r="4.5"/>
<text class="t-big" x="526" y="298">85%</text>
<text class="t-val" x="576" y="298">11 of 13 · likely 57%–96%</text>
<text class="t-row" x="24" y="324">New dependencies</text>
<line class="ci c-disc" x1="321.1" y1="320" x2="425.1" y2="320"/>
<circle class="c-disc" cx="371.0" cy="320" r="4.5"/>
<text class="t-big" x="526" y="324">45%</text>
<text class="t-val" x="576" y="324">9 of 20 · likely 25%–66%</text>
<text class="t-note" x="24" y="380">Graded by AI models, not people. Two models from different vendors agreed on 266 of 276 findings; a third, from one of those</text>
<text class="t-note" x="24" y="394">vendors, settled the other 10. One pull request holds 52 of the findings, so the per-pull-request range is wider. Every pull</text>
<text class="t-note" x="24" y="408">request here was merged, so this cannot show whether maintainers wanted the blocks. Discipline 0.32.0. (measured)</text>
</svg>
