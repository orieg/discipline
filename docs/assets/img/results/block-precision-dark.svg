<line class="ci c-disc" x1="454.1" y1="104" x2="487.5" y2="104"/>
<circle class="c-disc" cx="473.5" cy="104" r="4.5"/>
<text class="t-big" x="526" y="108">84%</text>
<text class="t-val" x="576" y="108">103 of 122 · likely 76%–90%</text>
<text class="t-row" x="24" y="134">Discipline, per pull request</text>
<line class="ci c-disc" x1="408.5" y1="130" x2="500.0" y2="130"/>
<circle class="c-hollow" cx="473.5" cy="130" r="4.5"/>
<text class="t-big" x="526" y="134">84%</text>
<text class="t-val" x="576" y="134">103 of 122 · likely 59%–95%</text>
