.c-disc{fill:#818cf8;stroke:#818cf8} .c-base{fill:#94a3b8;stroke:#94a3b8}
.c-hollow{fill:#0d1117;stroke:#818cf8}
</style></defs>
<rect class="bg" width="760" height="430" rx="6"/>
<rect class="border" x=".5" y=".5" width="759" height="429" rx="6"/>
<text class="t-title" x="24" y="32">Discipline's blocks are correct 84% of the time; the simple rule's, 2%</text>
<text class="t-sub" x="24" y="52">Correct: the flagged code really has the problem the block names. The simple rule is a baseline for comparison:</text>
<text class="t-sub" x="24" y="67">it blocks any pull request that changes a test, CI or configuration file. Dot: measured. Line: likely range.</text>
