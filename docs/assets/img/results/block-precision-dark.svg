<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 477" width="100%">
<title>When discipline blocks, the flagged code has the problem its rule names 84% of the time; for the simple rule's flags, 2.0%</title>
<defs><style>
.bg{fill:#fff} .border{stroke:#e2e8f0;fill:none} .grid{stroke:#f1f5f9;stroke-dasharray:2,3}
