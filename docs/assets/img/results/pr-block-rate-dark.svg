<circle class="c-disc" cx="353.3" cy="84" r="4.5"/>
<text class="t-val" x="826" y="88">41/232  [13.3, 23.1]</text>
<text class="t-row" x="24" y="114">test-path twin</text>
<line class="ci c-twin" x1="532.8" y1="110" x2="604.0" y2="110"/>
<circle class="c-twin" cx="568.9" cy="110" r="4.5"/>
<text class="t-val" x="826" y="114">130/232  [49.6, 62.3]</text>
<text class="t-note" x="24" y="172">agent-pr-precision-v6: 232 merged coding-agent pull requests in 8 public repositories. The test-path twin flags any change to an existing test file, a CI workflow or a manifest / test configuration.</text>
<text class="t-note" x="24" y="186">Blocked is not wrong: whether each block was warranted is the precision question, which is unresolved (precision-raters chart). (measured: Apple M1 macOS 26.4.1 arm64, 794362b6)</text>
