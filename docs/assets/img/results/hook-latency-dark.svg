<line class="ci c-disc" x1="276.5" y1="310" x2="276.6" y2="310"/>
<circle class="c-disc" cx="276.6" cy="310" r="4.5"/>
<text class="t-big" x="526" y="314">4.3 s</text>
<text class="t-val" x="576" y="314">2.1x faster</text>
<text class="t-note" x="24" y="370">Release builds with the network off. The two speed-ups are #994 and #995; the method is in docs/benchmarks/hook-latency.md.</text>
<text class="t-note" x="24" y="384">(measured)</text>
