.c-disc{fill:#818cf8;stroke:#818cf8} .c-base{fill:#94a3b8;stroke:#94a3b8}
.c-hollow{fill:#0d1117;stroke:#818cf8}
</style></defs>
<rect class="bg" width="760" height="406" rx="6"/>
<rect class="border" x=".5" y=".5" width="759" height="405" rx="6"/>
<text class="t-title" x="24" y="32">The check after each agent edit now takes 4.3 to 8.4 seconds, down from 9.3 to 47</text>
<text class="t-sub" x="24" y="52">Typical (median) time for the check that runs after an agent edits one file, over 7 runs. Lower is better. Runs</text>
<text class="t-sub" x="24" y="67">varied by under 0.15 s.</text>
<text class="t-head" x="24" y="94">On this repository (large)</text>
<line class="grid" x1="254.0" y1="110" x2="254.0" y2="194"/>
<text class="t-axis" x="254.0" y="208" text-anchor="middle">0 s</text>
<line class="grid" x1="306.0" y1="110" x2="306.0" y2="194"/>
<text class="t-axis" x="306.0" y="208" text-anchor="middle">10 s</text>
<line class="grid" x1="358.0" y1="110" x2="358.0" y2="194"/>
<text class="t-axis" x="358.0" y="208" text-anchor="middle">20 s</text>
<line class="grid" x1="410.0" y1="110" x2="410.0" y2="194"/>
<text class="t-axis" x="410.0" y="208" text-anchor="middle">30 s</text>
<line class="grid" x1="462.0" y1="110" x2="462.0" y2="194"/>
<text class="t-axis" x="462.0" y="208" text-anchor="middle">40 s</text>
<line class="grid" x1="514.0" y1="110" x2="514.0" y2="194"/>
<text class="t-axis" x="514.0" y="208" text-anchor="middle">50 s</text>
<line class="axis" x1="254" y1="194" x2="514" y2="194"/>
<text class="t-row" x="24" y="124">Before</text>
<line class="ci c-base" x1="499.7" y1="120" x2="500.2" y2="120"/>
<circle class="c-base" cx="500.0" cy="120" r="4.5"/>
<text class="t-big" x="526" y="124">47.3 s</text>
<text class="t-val" x="576" y="124"></text>
<text class="t-row" x="24" y="150">Faster engine</text>
<line class="ci c-disc" x1="355.5" y1="146" x2="356.2" y2="146"/>
<circle class="c-hollow" cx="355.9" cy="146" r="4.5"/>
<text class="t-big" x="526" y="150">19.6 s</text>
<text class="t-val" x="576" y="150"></text>
<text class="t-row" x="24" y="176">+ checks only what the edit touches</text>
<line class="ci c-disc" x1="297.8" y1="172" x2="298.1" y2="172"/>
<circle class="c-disc" cx="297.9" cy="172" r="4.5"/>
<text class="t-big" x="526" y="176">8.4 s</text>
<text class="t-val" x="576" y="176">5.6x faster</text>
<text class="t-head" x="24" y="232">On ripgrep (a mid-size Rust project)</text>
<line class="grid" x1="254.0" y1="248" x2="254.0" y2="332"/>
<text class="t-axis" x="254.0" y="346" text-anchor="middle">0 s</text>
<line class="grid" x1="306.0" y1="248" x2="306.0" y2="332"/>
<text class="t-axis" x="306.0" y="346" text-anchor="middle">10 s</text>
<line class="grid" x1="358.0" y1="248" x2="358.0" y2="332"/>
<text class="t-axis" x="358.0" y="346" text-anchor="middle">20 s</text>
<line class="grid" x1="410.0" y1="248" x2="410.0" y2="332"/>
<text class="t-axis" x="410.0" y="346" text-anchor="middle">30 s</text>
<line class="grid" x1="462.0" y1="248" x2="462.0" y2="332"/>
<text class="t-axis" x="462.0" y="346" text-anchor="middle">40 s</text>
<line class="grid" x1="514.0" y1="248" x2="514.0" y2="332"/>
<text class="t-axis" x="514.0" y="346" text-anchor="middle">50 s</text>
<line class="axis" x1="254" y1="332" x2="514" y2="332"/>
<text class="t-row" x="24" y="262">Before</text>
<line class="ci c-base" x1="302.5" y1="258" x2="302.6" y2="258"/>
<circle class="c-base" cx="302.6" cy="258" r="4.5"/>
<text class="t-big" x="526" y="262">9.3 s</text>
<text class="t-val" x="576" y="262"></text>
<text class="t-row" x="24" y="288">Faster engine</text>
<line class="ci c-disc" x1="286.9" y1="284" x2="287.1" y2="284"/>
<circle class="c-hollow" cx="287.0" cy="284" r="4.5"/>
<text class="t-big" x="526" y="288">6.3 s</text>
<text class="t-val" x="576" y="288"></text>
