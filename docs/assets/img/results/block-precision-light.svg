<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 415" width="100%">
<title>Discipline's blocks are correct 84% of the time; the simple rule's, 2%</title>
<defs><style>
.bg{fill:#fff} .border{stroke:#e2e8f0;fill:none} .grid{stroke:#f1f5f9;stroke-dasharray:2,3}
