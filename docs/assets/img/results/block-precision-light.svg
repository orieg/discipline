.c-disc{fill:#4f46e5;stroke:#4f46e5} .c-base{fill:#64748b;stroke:#64748b}
.c-hollow{fill:#fff;stroke:#4f46e5;stroke-width:2px}
.ci{stroke-width:2.5px;stroke-linecap:round}
</style></defs>
