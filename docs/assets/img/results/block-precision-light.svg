<text class="t-note" x="24" y="365">Graded by AI models, not people. Two models from different vendors agreed on 266 of 276 findings; a third, from one of those</text>
<text class="t-note" x="24" y="379">vendors, settled the other 10. One pull request holds 52 of the findings, so the per-pull-request range is wider. Every pull</text>
<text class="t-note" x="24" y="393">request here was merged, so this cannot show whether maintainers wanted the blocks. Discipline 0.32.0. (measured)</text>
