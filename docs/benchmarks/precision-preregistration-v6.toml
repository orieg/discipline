[[gate_floors]]
class = "heuristic-and-prose"
precision_floor = 0.80
assumed_precision = 0.88
required_n = 245
rationale = """
Unchanged from v2 to v5. Prose, regex-corpus, and secret/PII pattern gates operate over
natural-language markdown, comments, and free-form strings; blocking precision must
clear a 0.80 Wilson 95% lower bound. Requiring n=245 (sample_size_for_interval at the
0.80 floor) ensures that at assumed precision 0.88 (k=216), the Wilson 95% lower bound
(0.8333) strictly clears 0.80.
"""
gates = [
  "time-estimates",
  "pii",
  "instruction-smuggling",
  "provenance-tags",
  "gate-command-lint",
  "mechanism-sections",
  "citation-anchors",
]
unlisted_gate_rule = """
A finding from a gate in neither list (the registry is the same 46 gates at 82d02046,
0.25.3, 0.26.0, 0.27.0 and 0.28.1; `claim-labels`, `commit-provenance`, `review-threads`, `ratified-paths` and the
opt-in tool gates are unlisted) is counted in `heuristic-and-prose`, as v2's generator
does, and named in the results.
"""
