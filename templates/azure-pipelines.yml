# templates/azure-pipelines.yml
# Azure Pipelines template for Discipline Diff Sentinel & AI Coding Agent Gatekeeper
# Reference: https://learn.microsoft.com/en-us/azure/devops/pipelines/

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

container:
  # Major tag tracks the latest v0 release; pin an exact version (v0.7.1) or a digest for reproducible gating.
  image: ghcr.io/orieg/discipline:v0
  options: --user 10001:10001

variables:
  # Target branch in PR builds (`refs/heads/<branch>`), else main
  DISCIPLINE_BASE_REF: $[ coalesce(variables['System.PullRequest.TargetBranch'], 'main') ]

steps:
  - checkout: self
    fetchDepth: 0

  - script: |
      set -euo pipefail
      # A PR checkout has no local branches: compare against the remote-tracking ref.
      base="${DISCIPLINE_BASE_REF#refs/heads/}"
      base="${base#origin/}"
      echo "Target base ref: origin/${base}"
      git fetch origin "${base}" --depth=100 || true
      discipline check --base "origin/${base}" --json-out discipline-report.json
    displayName: 'Run Discipline Gatekeeper'

  - publish: $(System.DefaultWorkingDirectory)/discipline-report.json
    artifact: DisciplineReport
    condition: always()
    displayName: 'Publish Discipline Report'
