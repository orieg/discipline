apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: discipline-sentinel
  annotations:
    workflows.argoproj.io/description: >-
      Universal CI/CD sentinel and AI coding agent diff guardrail.
      Enforces AST diff inspection (preventing assertion weakening, vacuous tests,
      and test suppression), repository hygiene, and micro-benchmark regression bounds.
spec:
  entrypoint: pre-merge-pipeline
  arguments:
    parameters:
      - name: repo-url
        description: "Git repository URL to check"
      - name: target-branch
        value: "main"
        description: "Target base branch for diff analysis"
      - name: source-branch
        description: "Source branch or PR head commit to inspect"
      - name: pr-body
        value: ""
        description: "Pull request body markdown text for directive and hygiene inspection"
      - name: test-report
        value: ""
        description: "Path to test report XML file relative to repo root (JUnit XML) for test-floor identity ratcheting"
      - name: discipline-image
        # Major tag tracks the latest v0 release; pin an exact version (v0.26.0) or a digest for reproducible gating.
        value: "ghcr.io/orieg/discipline:v0"
        description: "Discipline container image"

  templates:
    # -------------------------------------------------------------------------
    # Pipeline entrypoint demonstrating discipline as a mandatory pre-merge gate
    # -------------------------------------------------------------------------
    - name: pre-merge-pipeline
      inputs:
        parameters:
          - name: repo-url
          - name: target-branch
          - name: source-branch
          - name: pr-body
          - name: test-report
          - name: discipline-image
      dag:
        tasks:
          # Phase 1: Diff Sentinel Gate Check (Fails closed on drift or regression)
          - name: run-discipline-gate
            template: discipline-gate
            arguments:
              parameters:
                - name: repo-url
                  value: "{{inputs.parameters.repo-url}}"
                - name: target-branch
                  value: "{{inputs.parameters.target-branch}}"
                - name: source-branch
                  value: "{{inputs.parameters.source-branch}}"
                - name: pr-body
                  value: "{{inputs.parameters.pr-body}}"
                - name: test-report
                  value: "{{inputs.parameters.test-report}}"
                - name: discipline-image
                  value: "{{inputs.parameters.discipline-image}}"

          # Phase 2: Downstream Build & Test (Blocked if discipline gate fails)
          - name: downstream-build
            dependencies: [run-discipline-gate]
            template: sample-downstream-task
            arguments:
              parameters:
                - name: message
                  value: "Discipline sentinel passed cleanly. Proceeding to compilation."

    # -------------------------------------------------------------------------
    # Task Template: Discipline Gate execution with JUnit & SARIF artifact capture
    # -------------------------------------------------------------------------
    - name: discipline-gate
      inputs:
        parameters:
          - name: repo-url
          - name: target-branch
          - name: source-branch
          - name: pr-body
          - name: test-report
          - name: discipline-image
      outputs:
        parameters:
          # success | failure | could-not-check: report could-not-check as its own
          # commit status rather than as a gate failure.
          - name: discipline-status
            valueFrom:
              path: /workspace/reports/status
              default: "could-not-check"
        artifacts:
          # Captured JUnit XML report for test dashboard integration
          - name: junit-report
            path: /workspace/reports/junit.xml
            archive:
              none: {}
            optional: true
          # Captured SARIF report for static security / code scanning
          - name: sarif-report
            path: /workspace/reports/sarif.sarif
            archive:
              none: {}
            optional: true
          # Full JSON execution summary
          - name: discipline-summary
            path: /workspace/reports/discipline.json
            archive:
              none: {}
            optional: true
      container:
        image: "{{inputs.parameters.discipline-image}}"
        workingDir: /workspace
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        env:
          - name: PR_BODY
            value: "{{inputs.parameters.pr-body}}"
          - name: DISCIPLINE_TRUST_WORKSPACE
            value: "1"
          - name: DISCIPLINE_TEST_REPORT
            value: "{{inputs.parameters.test-report}}"
          # Judge the change by the target branch's discipline.toml, so a pull request
          # cannot loosen the policy that judges it (config-integrity still reports the edit).
          - name: DISCIPLINE_POLICY_FROM
            value: "base"
          # Cap the text report this step prints, for log services with a per-step budget.
          # The JSON, JUnit and SARIF reports stay complete.
          - name: DISCIPLINE_MAX_REPORT_LINES
            value: "400"
          # Optional. The merged-pr-body directive source and the review-threads gate read the
          # forge's API; a least-privilege token (contents: read; pull-requests: read for
          # the merged-pr-body lookup on a private repository) is enough. Without it those
          # lookups are unauthenticated and soon rate-limited on a shared runner.
          # - name: DISCIPLINE_FORGE_TOKEN
          #   valueFrom:
          #     secretKeyRef:
          #       name: discipline-forge-token
          #       key: token
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            mkdir -p /workspace/repo /workspace/reports
            cd /workspace/repo

            # Exit codes: 0 clean, 1 findings, 2 could not check (clone, merge base,
            # configuration or forge failure). Infrastructure trouble is reported as its
            # own state, never as a finding.
            could_not_check() {
              echo "discipline: could not check: $1" >&2
              echo "could-not-check" > /workspace/reports/status
              exit 2
            }

            echo "Cloning repository..."
            git init -q
            git remote add origin "{{inputs.parameters.repo-url}}"
            git fetch -q origin --depth=50 \
              "{{inputs.parameters.target-branch}}" "{{inputs.parameters.source-branch}}" \
              || could_not_check "fetch failed"
            # A depth-50 fetch has no merge base once the branch is more than 50 commits
            # from the target. Deepen until one resolves; a full history is the fallback.
            until git merge-base "origin/{{inputs.parameters.target-branch}}" \
                "origin/{{inputs.parameters.source-branch}}" >/dev/null 2>&1; do
              if [ "$(git rev-parse --is-shallow-repository)" = "false" ]; then
                could_not_check "no merge base between the target and source branches"
              fi
              git fetch -q origin --deepen=200 \
                "{{inputs.parameters.target-branch}}" "{{inputs.parameters.source-branch}}" \
                || git fetch -q --unshallow origin \
                || could_not_check "deepening the fetch failed"
            done
            git checkout -q -b inspected "origin/{{inputs.parameters.source-branch}}"

            echo "Executing discipline check with JUnit XML and JSON report generation..."
            rc=0
            discipline check \
              --base "origin/{{inputs.parameters.target-branch}}" \
              --format terminal \
              --report-junit /workspace/reports/junit.xml \
              --report-sarif /workspace/reports/sarif.sarif \
              --json-out /workspace/reports/discipline.json || rc=$?

            # Map the exit code to a distinct status a later step (or a commit-status
            # notifier reading this file) can report: a could-not-check run is not a
            # violation and should not be shown as one.
            case "$rc" in
              0) echo "success" > /workspace/reports/status ;;
              1) echo "failure" > /workspace/reports/status ;;
              *) echo "could-not-check" > /workspace/reports/status
                 echo "discipline: could not check (exit $rc); see the report above" >&2 ;;
            esac
            exit "$rc"

    # -------------------------------------------------------------------------
    # Task Template: Placeholder downstream job
    # -------------------------------------------------------------------------
    - name: sample-downstream-task
      inputs:
        parameters:
          - name: message
      container:
        image: alpine:3.21@sha256:ce64758a109eb420d874a118f87920e625e12d3634e03b4a5573fd9f6e5d3507
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        command: ["/bin/echo"]
        args: ["{{inputs.parameters.message}}"]

