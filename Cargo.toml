[package]
name = "discipline"
version = "0.8.0"
edition = "2021"
rust-version = "1.90"
authors = ["Nicolas Brousse <nicolas@brousse.info>"]
license = "MIT OR Apache-2.0"
description = "Universal CI/CD gatekeeper and AI coding agent diff sentinel"
readme = "README.md"
repository = "https://github.com/orieg/discipline"
homepage = "https://github.com/orieg/discipline"
keywords = ["ci", "testing", "ai-agents", "tree-sitter", "quality-gate"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_mangen = "0.2"
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0"
regex = "1.10"
tree-sitter = "0.25"
tree-sitter-rust = { version = "0.24", optional = true }
tree-sitter-python = { version = "0.25", optional = true }
tree-sitter-javascript = { version = "0.25", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-java = { version = "0.23", optional = true }
tree-sitter-go = { version = "0.25", optional = true }
tree-sitter-php = { version = "0.24", optional = true }
tree-sitter-c = { version = "0.24", optional = true }
tree-sitter-cpp = { version = "0.23", optional = true }
tree-sitter-c-sharp = { version = "0.23", optional = true }
tree-sitter-ruby = { version = "0.23", optional = true }
# No network features: discipline only reads the local object database, and
# dropping `https` keeps openssl out of the static musl build.
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
globset = "0.4"
serde_json = "1.0"
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4", default-features = false }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
bzip2-rs = { version = "0.1.2", default-features = false }
fancy-regex = "0.19.2"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }

[features]
default = [
    "lang-rust",
    "lang-golden",
    "lang-python",
    "lang-javascript",
    "lang-java",
    "lang-go",
    "lang-php",
    "lang-c",
    "lang-cpp",
    "lang-csharp",
    "lang-ruby",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-golden = []
lang-python = ["dep:tree-sitter-python"]
lang-javascript = ["dep:tree-sitter-javascript", "dep:tree-sitter-typescript"]
lang-java = ["dep:tree-sitter-java"]
lang-go = ["dep:tree-sitter-go"]
lang-php = ["dep:tree-sitter-php"]
lang-c = ["dep:tree-sitter-c"]
lang-cpp = ["dep:tree-sitter-cpp"]
lang-csharp = ["dep:tree-sitter-c-sharp"]
lang-ruby = ["dep:tree-sitter-ruby"]

[dev-dependencies]
tempfile = "3.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
