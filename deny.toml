# cargo-deny policy. discipline decides whether other projects' CI passes, so
# its own dependency tree is held to an allow-list, not a deny-list.

[graph]
all-features = true

[advisories]
yanked = "deny"
# Individual ignores only, each with a reason, so a *new* advisory still fails.
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

# The in-process HTTPS client (ureq + rustls) used by the opt-in forge features
# (AGENTS.md §3.3). Scoped to these crates, not added to the global allow-list.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "subtle"
allow = ["BSD-3-Clause"]

# Mozilla's root certificate list, as data.
[[licenses.exceptions]]
crate = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]

[[licenses.exceptions]]
crate = "webpki-root-certs"
allow = ["CDLA-Permissive-2.0"]
